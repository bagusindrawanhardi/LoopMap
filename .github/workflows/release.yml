name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            release_name: loopmap-windows.exe
            binary: dist/loopmap.exe
          - os: ubuntu-latest
            release_name: loopmap-linux
            binary: dist/loopmap
          - os: macos-latest
            release_name: loopmap-macos
            binary: dist/loopmap

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name loopmap cld_tool.py

      - name: Rename binary for release
        shell: bash
        run: cp "${{ matrix.binary }}" "dist/${{ matrix.release_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: dist/${{ matrix.release_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/loopmap-windows.exe
            artifacts/loopmap-macos
            artifacts/loopmap-linux
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | Windows  | `loopmap-windows.exe` |
            | macOS    | `loopmap-macos` |
            | Linux    | `loopmap-linux` |

            **No Python required.** Run `installer\install.bat` (Windows) or `bash installer/install.sh` (macOS/Linux) from the repo root to install automatically.

            **Usage:**
            ```
            # Windows
            loopmap.exe --project usecases/<your-topic> --serve

            # macOS / Linux
            chmod +x loopmap
            ./loopmap --project usecases/<your-topic> --serve
            ```
